<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unhue</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0b10;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #wrapper {
        position: relative;
        width: min(100vw, calc(100vh * 512 / 320));
        max-height: 100vh;
        aspect-ratio: 512 / 320;
      }

      #wrapper canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      #game {
        image-rendering: pixelated;
      }

      #hud {
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="wrapper">
      <canvas id="game" width="512" height="320"></canvas>
      <canvas id="hud" width="1024" height="640"></canvas>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
