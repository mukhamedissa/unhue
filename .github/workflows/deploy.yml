name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build

      - name: Check size limit
        run: |
          LIMIT=13312
          SIZE=$(stat -c%s dist/game.zip)
          LEFT=$((LIMIT - SIZE))
          PCT=$(awk "BEGIN{printf \"%.1f\", $SIZE*100/$LIMIT}")
          {
            echo "### Unhue build"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| zip size | $SIZE B |"
            echo "| limit | $LIMIT B |"
            echo "| used | $PCT% |"
            echo "| remaining | $LEFT B |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::game.zip is $SIZE B, over the js13k limit of $LIMIT B by $((-LEFT)) B"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
